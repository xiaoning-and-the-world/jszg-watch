name: 冒烟测试

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只做离线逻辑验证 + 一次只读抓取，不写文件、不推送
      - name: 运行冒烟测试
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/ci_smoke_test.py
